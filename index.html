<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="color-scheme" content="light dark" />
    <title>مبدع · Mobde3 · Engosoft</title>
    <link rel="icon" href="/brand/engosoft-favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Almarai:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve theme and language before first paint so nothing flips after load.
      try {
        var root = document.documentElement;
        var saved = localStorage.getItem('social-pulse-theme');
        var theme = saved === 'light' || saved === 'dark' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0d1015' : '#f6f8fb');
        var lang = localStorage.getItem('social-pulse-lang');
        if (lang === 'en' || lang === 'ar') {
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
